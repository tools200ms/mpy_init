
services:
  debian:
    image: debian
    volumes:
      - ./Makefile:/usr/src/yinit/Makefile
      - ./src/:/usr/src/yinit/src
      - ./targets:/etc/yinit/targets:ro
    command: "sh -c 'apt update && apt install -y cython3 make'"
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    network_mode: host
    environment:
      DBG_SERVER: "127.0.0.1:5678"
    cap_add: ['ALL']
    devices:
      - /dev/fuse

  alpine:
    image: alpine
    volumes:
      - ./Makefile:/usr/src/yinit/Makefile
      - ./src/:/usr/src/yinit/src
      - ./targets:/etc/yinit/targets:ro
      command: "/bin/sh -c 'apk update && apk add cython gcc make musl-dev python3-dev'"
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    network_mode: host
    environment:
      DBG_SERVER: "127.0.0.1:5678"
    cap_add: ['ALL']
    devices:
      - /dev/fuse

  sandbox:
    build:
      context: sandbox
    volumes:
      - ./mpy_init:/root/mpy_init:ro
      - ./targets:/root/targets:ro
      - ./pyproject.toml:/root/pyproject.toml:ro
    network_mode: host
    environment:
      DBG_SERVER: "127.0.0.1:5678"
    cap_add: ['ALL']
    devices:
      - /dev/fuse
